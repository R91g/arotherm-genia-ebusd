name: Release & Distribution

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Unit Tests & Code Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies (Ruff & Pyright)
        run: pip install ruff pyright

      - name: Run Unit Tests
        run: python -m unittest discover tests

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests

      - name: Run Pyright Type Checker
        run: pyright

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Action Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  build-and-attach-zip:
    name: Build & Attach HACS Release ZIP
    runs-on: ubuntu-latest
    needs: [test-and-lint, hassfest, hacs]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build HACS ZIP Archive
        run: |
          cd custom_components/arotherm_genia_ebusd
          zip -r ../../arotherm_genia_ebusd.zip .
          cd ../..

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: arotherm_genia_ebusd.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
