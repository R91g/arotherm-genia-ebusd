<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="soft-shadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#475569" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- HEADER -->
  <text x="40" y="38" fill="#0f172a" font-size="18" font-weight="800" letter-spacing="-0.2">Cooling Double-Lock Safety Mechanism (Hardware Locks 1 &amp; 2)</text>
  <text x="40" y="58" fill="#64748b" font-size="12.5">Firmware safety envelope preventing accidental condensation and unwanted winter cooling</text>

  <!-- STEP 0: INITIATE DEMAND -->
  <g transform="translate(300, 80)" filter="url(#soft-shadow)">
    <rect width="360" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="180" y="22" fill="#0284c7" font-size="11" font-weight="800" letter-spacing="0.6" text-anchor="middle">COOLING DEMAND INITIATED</text>
    <text x="180" y="39" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Zone Thermostat / Home Assistant Climate Service</text>
  </g>

  <!-- Connector from demand to Gate 1 -->
  <path d="M 480 132 L 480 158" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== GATE 1 CONTAINER ==================== -->
  <g transform="translate(40, 160)">
    <rect width="880" height="195" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="880" height="30" rx="12" fill="#f1f5f9"/>
    <text x="20" y="20" fill="#475569" font-size="11" font-weight="800" letter-spacing="0.6">GATE 1: SEASONAL CALENDAR WINDOW</text>

    <!-- Sub-card G1 Question (Left) -->
    <g transform="translate(25, 42)">
      <rect width="385" height="62" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="192" y="26" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">Is CoolingStartDate &#8804; CurrentDate &#8804; CoolingEndDate?</text>
      <text x="192" y="46" fill="#64748b" font-size="11" text-anchor="middle">Or end date set to year 2099 for permanent HA bypass</text>
    </g>

    <!-- Branch No (Red) -->
    <path d="M 140 104 L 140 126" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="150" y="118" fill="#dc2626" font-size="10" font-weight="800">NO</text>
    <g transform="translate(25, 128)">
      <rect width="385" height="48" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
      <text x="192" y="21" fill="#991b1b" font-size="11.5" font-weight="800" text-anchor="middle">CALENDAR LOCKOUT ACTIVE</text>
      <text x="192" y="37" fill="#b91c1c" font-size="10.5" text-anchor="middle">CoolingReleaseStatus = off &#183; 4-way valve de-energized &#183; Inverter locked</text>
    </g>

    <!-- Branch Yes to Temp Check (Green) -->
    <path d="M 410 73 L 465 73" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="438" y="66" fill="#15803d" font-size="10" font-weight="800" text-anchor="middle">YES</text>

    <!-- Sub-card Temp Check (Right) -->
    <g transform="translate(470, 42)">
      <rect width="385" height="62" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <text x="192" y="26" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">Is Outdoor Temperature &#8805; 15 &#176;C (safety cutoff)?</text>
      <text x="192" y="46" fill="#15803d" font-size="11" text-anchor="middle">Protects compressor and prevents plate heat exchanger freezing</text>
    </g>

    <!-- Branch Temp No (Red) -->
    <path d="M 580 104 L 580 126" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="590" y="118" fill="#dc2626" font-size="10" font-weight="800">NO</text>
    <g transform="translate(470, 128)">
      <rect width="185" height="48" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
      <text x="92" y="20" fill="#991b1b" font-size="10" font-weight="800" text-anchor="middle">LOW OUTDOOR TEMP LOCKOUT</text>
      <text x="92" y="36" fill="#b91c1c" font-size="9.5" text-anchor="middle">CoolingReleaseStatus = off</text>
    </g>

    <!-- Branch Temp Yes -> Gate 1 Cleared (Green) -->
    <path d="M 740 104 L 740 126" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="750" y="118" fill="#15803d" font-size="10" font-weight="800">YES</text>
    <g transform="translate(670, 128)">
      <rect width="185" height="48" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
      <text x="92" y="20" fill="#065f46" font-size="10.5" font-weight="800" text-anchor="middle">GATE 1 CLEARED</text>
      <text x="92" y="36" fill="#047857" font-size="9.5" font-weight="700" text-anchor="middle">CoolingReleaseStatus = on</text>
    </g>
  </g>

  <!-- Connector from Gate 1 to Gate 2 -->
  <path d="M 762 355 L 762 375 L 480 375 L 480 395" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

  <!-- ==================== GATE 2 CONTAINER ==================== -->
  <g transform="translate(40, 395)">
    <rect width="880" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="0" y="0" width="880" height="30" rx="12" fill="#f1f5f9"/>
    <text x="20" y="20" fill="#475569" font-size="11" font-weight="800" letter-spacing="0.6">GATE 2: ZONE OPERATIONAL MODE</text>

    <!-- Branch G2 No (Left Arrow) -->
    <path d="M 305 73 L 275 73" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="290" y="66" fill="#dc2626" font-size="10" font-weight="800" text-anchor="middle">NO</text>

    <!-- Sub-card G2 No: Circuito en Espera (Left) -->
    <g transform="translate(25, 42)">
      <rect width="245" height="64" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
      <text x="122" y="21" fill="#991b1b" font-size="11" font-weight="800" text-anchor="middle">CIRCUIT IDLE</text>
      <text x="122" y="38" fill="#b91c1c" font-size="10" text-anchor="middle">Zone set to off mode</text>
      <text x="122" y="53" fill="#b91c1c" font-size="9.5" text-anchor="middle">Inverter does not reverse cycle</text>
    </g>

    <!-- Sub-card G2 Question (Center) -->
    <g transform="translate(305, 42)">
      <rect width="270" height="64" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
      <text x="135" y="27" fill="#3730a3" font-size="13" font-weight="700" text-anchor="middle">Is Z1OpModeCooling &#8800; off?</text>
      <text x="135" y="47" fill="#64748b" font-size="11" text-anchor="middle">Requires mode auto or day</text>
    </g>

    <!-- Branch G2 Yes (Right Arrow) -->
    <path d="M 575 73 L 605 73" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="590" y="66" fill="#15803d" font-size="10" font-weight="800" text-anchor="middle">YES</text>

    <!-- Sub-card G2 Yes: Refrigeración Activa (Right) -->
    <g transform="translate(610, 42)">
      <rect width="245" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="122" y="21" fill="#065f46" font-size="11" font-weight="800" text-anchor="middle">REVERSE-CYCLE COOLING ACTIVE</text>
      <text x="122" y="38" fill="#047857" font-size="10" font-weight="600" text-anchor="middle">4-way valve energized</text>
      <text x="122" y="53" fill="#047857" font-size="9.5" font-weight="600" text-anchor="middle">Flow to Z1CoolingTemp</text>
    </g>
  </g>

  <!-- ==================== FOOTER BADGES ==================== -->
  <g transform="translate(40, 540)">
    <rect width="280" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="15" y="23" fill="#0369a1" font-size="11" font-weight="700">Permanent HA Bypass:</text>
    <text x="15" y="42" fill="#0f172a" font-size="12" font-weight="600">CoolingEndDate = 01;01;99</text>
  </g>
  <g transform="translate(340, 540)">
    <rect width="280" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="15" y="23" fill="#b45309" font-size="11" font-weight="700">Safe Winter Lockout:</text>
    <text x="15" y="42" fill="#0f172a" font-size="12" font-weight="600">CoolingStartDate = EndDate = 01;01;19</text>
  </g>
  <g transform="translate(640, 540)">
    <rect width="280" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="15" y="23" fill="#4338ca" font-size="11" font-weight="700">Night Safety Setback:</text>
    <text x="15" y="42" fill="#0f172a" font-size="12" font-weight="600">Z1CoolingTemp = 30.0 &#176;C (Prevents night chilling)</text>
  </g>
</svg>