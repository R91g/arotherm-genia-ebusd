<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="pcb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ebus-wire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background subtle grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
  </pattern>
  <rect width="1060" height="640" fill="url(#grid)"/>

  <!-- ==================== HEADER ==================== -->
  <text x="50" y="45" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">aroTHERM &amp; GeniaAir — eBUS Hardware Wiring Architecture</text>
  <text x="50" y="70" fill="#94a3b8" font-size="14">Parallel bus topology with zero-polarity, official gateway coexistence, and Home Assistant local eBUSd</text>

  <!-- ==================== 1. OUTDOOR UNIT ==================== -->
  <g transform="translate(50, 110)">
    <rect width="210" height="190" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#1e293b"/>
    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">OUTDOOR UNIT</text>
    
    <text x="16" y="65" fill="#f8fafc" font-size="15" font-weight="600">aroTHERM plus /</text>
    <text x="16" y="85" fill="#f8fafc" font-size="15" font-weight="600">GeniaAir Max</text>
    <text x="16" y="108" fill="#94a3b8" font-size="12">Main PCB (08.hmux0)</text>
    <text x="16" y="126" fill="#64748b" font-size="11">R290 Inverter Compressor</text>

    <!-- Terminal block in Outdoor -->
    <rect x="16" y="145" width="80" height="30" rx="4" fill="#334155" stroke="#475569"/>
    <text x="26" y="165" fill="#fb923c" font-size="12" font-weight="700">eBUS</text>
    <circle cx="70" cy="160" r="3.5" fill="#fb923c"/>
    <circle cx="82" cy="160" r="3.5" fill="#fb923c"/>
  </g>

  <!-- ==================== 2. INDOOR HYDRAULIC BOARD (PCB) ==================== -->
  <g transform="translate(310, 110)">
    <rect width="360" height="330" rx="14" fill="url(#pcb-grad)" stroke="#059669" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="360" height="40" rx="14" fill="#065f46"/>
    <text x="18" y="25" fill="#6ee7b7" font-size="13" font-weight="700" letter-spacing="1">INDOOR UNIT PCB (HYDRAULIC STATION)</text>
    <text x="18" y="65" fill="#f8fafc" font-size="14" font-weight="600">uniTOWER / GeniaSet / VWZ MEH / HPIM</text>
    <text x="18" y="83" fill="#a7f3d0" font-size="12">Internal eBUS Backplane &amp; Interface Board (76.vwzio)</text>

    <!-- Connector X25 [A | B] (Orange) -->
    <g transform="translate(25, 115)">
      <rect width="130" height="75" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <rect x="8" y="10" width="114" height="24" rx="4" fill="#c2410c"/>
      <text x="18" y="27" fill="#ffffff" font-size="13" font-weight="800">X25  ( A | B )</text>
      <circle cx="45" cy="54" r="5" fill="#fb923c"/>
      <circle cx="85" cy="54" r="5" fill="#fb923c"/>
      <text x="18" y="72" fill="#fdba74" font-size="10" font-weight="600">Outdoor Unit Bus In</text>
    </g>

    <!-- Connector BUS [+ | -] (Red) -->
    <g transform="translate(205, 115)">
      <rect width="130" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="8" y="10" width="114" height="24" rx="4" fill="#b91c1c"/>
      <text x="24" y="27" fill="#ffffff" font-size="13" font-weight="800">BUS  ( + | - )</text>
      <circle cx="45" cy="54" r="5" fill="#f87171"/>
      <circle cx="85" cy="54" r="5" fill="#f87171"/>
      <text x="18" y="72" fill="#fca5a5" font-size="10" font-weight="600">System Accessories</text>
    </g>

    <!-- Internal PCB Bridge Note -->
    <path d="M 155 152 L 205 152" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,4"/>
    <rect x="80" y="210" width="200" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="92" y="230" fill="#fde047" font-size="11" font-weight="600">⚡ Internally connected in parallel</text>

    <!-- Explanation Box at bottom of PCB -->
    <rect x="18" y="255" width="324" height="60" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="276" fill="#a7f3d0" font-size="11" font-weight="600">✓ Non-Polar Bus:</text>
    <text x="130" y="276" fill="#e2e8f0" font-size="11">Wires can be swapped (+/- or A/B).</text>
    <text x="28" y="298" fill="#a7f3d0" font-size="11" font-weight="600">✓ Shared Rail:</text>
    <text x="110" y="298" fill="#e2e8f0" font-size="11">Connect to BUS or X25 indifferently.</text>
  </g>

  <!-- ==================== 3. OFFICIAL GATEWAY (TOP RIGHT) ==================== -->
  <g transform="translate(740, 110)">
    <rect width="270" height="175" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="270" height="38" rx="12" fill="#0369a1"/>
    <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">OFFICIAL CLOUD GATEWAY</text>
    
    <text x="16" y="66" fill="#f8fafc" font-size="15" font-weight="600">myVAILLANT connect /</text>
    <text x="16" y="86" fill="#f8fafc" font-size="15" font-weight="600">MiGo Link (VR 921 / 940f)</text>
    <rect x="16" y="98" width="170" height="22" rx="4" fill="#0284c7" opacity="0.4"/>
    <text x="22" y="113" fill="#38bdf8" font-size="10" font-weight="700">100% PARALLEL COEXISTENCE</text>

    <!-- Gateway Ports -->
    <g transform="translate(16, 130)">
      <!-- eBUS 2-pin port -->
      <rect x="0" y="0" width="55" height="28" rx="4" fill="#15803d" stroke="#22c55e"/>
      <text x="10" y="18" fill="#ffffff" font-size="11" font-weight="700">eBUS</text>
      <!-- Power port -->
      <rect x="68" y="0" width="55" height="28" rx="4" fill="#334155"/>
      <text x="76" y="18" fill="#94a3b8" font-size="10">Power</text>
      <!-- WiFi/Eth -->
      <rect x="136" y="0" width="55" height="28" rx="4" fill="#334155"/>
      <text x="146" y="18" fill="#94a3b8" font-size="10">Wi-Fi</text>
    </g>
  </g>

  <!-- ==================== 4. eBUS ADAPTER (BOTTOM CENTER/RIGHT) ==================== -->
  <g transform="translate(360, 480)">
    <rect width="320" height="135" rx="12" fill="url(#card-grad)" stroke="#f97316" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="320" height="34" rx="12" fill="#c2410c"/>
    <text x="16" y="22" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">eBUS ADAPTER SHIELD (v5 / C6)</text>

    <text x="16" y="60" fill="#f8fafc" font-size="14" font-weight="600">eBUS to Wi-Fi / Ethernet / USB</text>
    <text x="16" y="78" fill="#94a3b8" font-size="11">ebusd.eu Hardware Adapter (eAS C6)</text>

    <!-- Adapter Ports -->
    <!-- 2-Pin eBUS Screw Terminal -->
    <rect x="16" y="92" width="85" height="30" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="24" y="112" fill="#ffffff" font-size="11" font-weight="700">eBUS (+ -)</text>
    <circle cx="70" cy="107" r="4" fill="#ffffff"/>
    <circle cx="85" cy="107" r="4" fill="#ffffff"/>

    <!-- USB-C Power Port -->
    <rect x="120" y="92" width="75" height="30" rx="4" fill="#334155" stroke="#475569"/>
    <text x="130" y="111" fill="#cbd5e1" font-size="10" font-weight="600">USB 5V</text>

    <!-- Wi-Fi / LAN Antenna badge -->
    <rect x="210" y="92" width="95" height="30" rx="4" fill="#0284c7" stroke="#38bdf8"/>
    <text x="220" y="111" fill="#ffffff" font-size="10" font-weight="700">Wi-Fi / LAN</text>
  </g>

  <!-- ==================== 5. HOME ASSISTANT SERVER ==================== -->
  <g transform="translate(740, 480)">
    <rect width="270" height="135" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="270" height="34" rx="12" fill="#4338ca"/>
    <text x="16" y="22" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="1">HOME ASSISTANT HOST</text>

    <text x="16" y="60" fill="#f8fafc" font-size="14" font-weight="600">HA OS / Supervised / Container</text>
    <text x="16" y="80" fill="#818cf8" font-size="12" font-weight="600">1. eBUSd Daemon (Add-on)</text>
    <text x="16" y="98" fill="#a5b4fc" font-size="12" font-weight="600">2. aroTHERM &amp; GeniaAir Integration</text>
    <text x="16" y="118" fill="#94a3b8" font-size="11">Sub-second local_push via MQTT JSON</text>
  </g>

  <!-- ==================== WIRING PATHS ==================== -->
  
  <!-- WIRE 1: Outdoor Unit to X25 on PCB -->
  <path d="M 100 160 C 180 160, 240 180, 335 180" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="335" cy="180" r="5" fill="#f97316"/>
  <rect x="180" y="150" width="90" height="20" rx="4" fill="#0f172a" stroke="#fb923c" stroke-width="1"/>
  <text x="186" y="164" fill="#fdba74" font-size="10" font-weight="600">2-wire eBUS</text>

  <!-- WIRE 2: PCB BUS port to Official Gateway -->
  <!-- Split point out of BUS port -->
  <path d="M 600 200 L 600 245 L 740 245" fill="none" stroke="#f87171" stroke-width="4"/>
  <circle cx="600" cy="200" r="5" fill="#ef4444"/>
  <circle cx="740" cy="245" r="5" fill="#ef4444"/>
  <rect x="630" y="233" width="90" height="20" rx="4" fill="#0f172a" stroke="#f87171" stroke-width="1"/>
  <text x="636" y="247" fill="#fca5a5" font-size="10" font-weight="600">2-wire eBUS</text>

  <!-- WIRE 3: PCB BUS port (or parallel splice) down to eBUS Adapter -->
  <path d="M 600 245 L 600 440 L 415 440 L 415 480" fill="none" stroke="#f87171" stroke-width="4"/>
  <circle cx="600" cy="245" r="6" fill="#fbbf24"/> <!-- Splice dot (WAGO / Double crimp) -->
  <circle cx="415" cy="480" r="5" fill="#22c55e"/>
  
  <!-- Wago / Parallel crimp badge -->
  <rect x="535" y="280" width="125" height="36" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="543" y="296" fill="#fde047" font-size="10" font-weight="700">PARALLEL TAP</text>
  <text x="543" y="309" fill="#94a3b8" font-size="9">WAGO 221 / Double Crimp</text>

  <!-- WIRE 4: Adapter to Home Assistant (Wi-Fi / LAN) -->
  <path d="M 680 545 L 740 545" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,5"/>
  <rect x="685" y="525" width="50" height="18" rx="3" fill="#0f172a" stroke="#38bdf8"/>
  <text x="690" y="538" fill="#38bdf8" font-size="9" font-weight="700">Wi-Fi / IP</text>

  <!-- USB Power line to Adapter -->
  <path d="M 290 590 L 360 590" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="360" cy="590" r="4" fill="#64748b"/>
  <text x="295" y="582" fill="#94a3b8" font-size="10">USB-C 5V</text>
</svg>
